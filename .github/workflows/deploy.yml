name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Determine deploy environment
        id: deploy-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "path=/var/www/ei" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "path=/var/www/secret" >> $GITHUB_OUTPUT
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets (dev)
        if: steps.deploy-env.outputs.env == 'dev'
        run: npm run build
        env:
          VITE_IMAGE_URL: ${{ secrets.VITE_IMAGE_URL_DEV }}
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL_DEV }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}

      - name: Build assets (production)
        if: steps.deploy-env.outputs.env == 'production'
        run: npm run build
        env:
          VITE_IMAGE_URL: ${{ secrets.VITE_IMAGE_URL_PROD }}
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL_PROD }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY_BASE64 }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo 'SSH works!'"

      - name: Clear server views folder (fix case sensitivity)
        run: |
          DEPLOY_PATH="${{ steps.deploy-env.outputs.path }}"
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "rm -rf $DEPLOY_PATH/resources/views"

      - name: Deploy to server
        run: |
          DEPLOY_PATH="${{ steps.deploy-env.outputs.path }}"

          # vendor/ is excluded so a failed composer install leaves the
          # previous working dependencies in place — the site keeps serving
          # old-vendor + new-code (mostly works) rather than no-vendor at all
          # (totally dead). composer install in the post-deploy step still
          # updates vendor on success.
          # 'P' (protect) keeps the previous build's hashed JS/CSS chunks from
          # being deleted by --delete. Clients still holding the old index.html
          # (open tab / bfcache) lazy-import old chunk hashes; if those files are
          # gone they 404 and Vue throws "error loading dynamically imported
          # module". Keeping them lets in-flight sessions finish; fresh loads
          # always get the new manifest + new files. Old chunks are pruned in the
          # post-deploy step.
          rsync -avz --delete \
            --filter='P public/build/assets/***' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='public/storage' \
            --exclude='storage' \
            --exclude='vendor' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$DEPLOY_PATH/

      - name: Run post-deploy commands
        run: |
          DEPLOY_PATH="${{ steps.deploy-env.outputs.path }}"
          
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            # Fail loud — without these, a failed composer install or migration
            # would still let the script reach the final echo, and the heredoc's
            # exit code would be 0. That's how prod broke silently on 2026-05-26.
            set -euo pipefail

            cd $DEPLOY_PATH

            # Fix permissions for web server
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            # Ensure storage symlink exists. Allowed to fail (already exists is fine).
            php artisan storage:link 2>/dev/null || true

            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Sweep build chunks left untouched for 30+ days. The rsync 'protect'
            # rule keeps old hashed assets so mid-deploy sessions don't break;
            # this stops them accumulating forever. 30 days is the grace window
            # for a client to still be holding a stale index.html. Allowed to fail.
            find $DEPLOY_PATH/public/build/assets -type f -mtime +30 -delete 2>/dev/null || true

            # Allowed to fail if queue isn't running.
            php artisan queue:restart 2>/dev/null || true

            echo "✅ Deployment complete!"
          EOF

      - name: Block crawlers on dev
        if: steps.deploy-env.outputs.env == 'dev'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            echo -e "User-agent: *\nDisallow: /" > /var/www/secret/public/robots.txt
          EOF

      # Post-deploy smoke test. Curls the deployed site's home page from the
      # GitHub runner; non-2xx response fails the workflow. Catches the class
      # of bug that hit on 2026-05-26 where the deploy reported success but
      # the site was 500'ing.
      - name: Smoke test deployed site
        run: |
          if [ "${{ steps.deploy-env.outputs.env }}" = "production" ]; then
            URL="${{ secrets.VITE_BASE_URL_PROD }}"
          else
            URL="${{ secrets.VITE_BASE_URL_DEV }}"
          fi
          echo "Smoke testing $URL"
          # Three attempts, 3s apart — gives caches/symlinks a beat to settle.
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL" || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "✅ Smoke test passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 3s..."
            sleep 3
          done
          echo "❌ Smoke test failed after 3 attempts — site is not responding."
          exit 1

      - name: Deployment summary
        run: |
          echo "🚀 Deployed to ${{ steps.deploy-env.outputs.env }}"
          echo "📁 Path: ${{ steps.deploy-env.outputs.path }}"
